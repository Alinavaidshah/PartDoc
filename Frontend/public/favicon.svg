<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Rounded Purple/Indigo Background Card -->
  <rect x="4" y="4" width="92" height="92" rx="28" ry="28" fill="#4f46e5" />
  
  <!-- Microchip Outer Line -->
  <rect x="26" y="26" width="48" height="48" rx="10" ry="10" fill="none" stroke="#ffffff" stroke-width="6" />
  
  <!-- Microchip Center Core -->
  <rect x="40" y="40" width="20" height="20" rx="4" ry="4" fill="none" stroke="#ffffff" stroke-width="5" />
  
  <!-- Top Microchip Pins -->
  <line x1="36" y1="17" x2="36" y2="26" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="50" y1="17" x2="50" y2="26" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="64" y1="17" x2="64" y2="26" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  
  <!-- Bottom Microchip Pins -->
  <line x1="36" y1="74" x2="36" y2="83" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="50" y1="74" x2="50" y2="83" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="64" y1="74" x2="64" y2="83" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  
  <!-- Left Microchip Pins -->
  <line x1="17" y1="36" x2="26" y2="36" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="17" y1="50" x2="26" y2="50" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="17" y1="64" x2="26" y2="64" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  
  <!-- Right Microchip Pins -->
  <line x1="74" y1="36" x2="83" y2="36" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="74" y1="50" x2="83" y2="50" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="74" y1="64" x2="83" y2="64" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
</svg>